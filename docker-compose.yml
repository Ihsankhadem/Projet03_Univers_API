services:
  app:
    build: .
    # context: .
    # dockerfile: Dockerfile
    container_name: univers-back

    ports:
      - "5000:5000"

    environment:
      PORT: 5000

      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: univers_blog

      JWT_SECRET: monsecret

    depends_on:
      - db

  db:
    image: mysql:8
    container_name: univers-db

    ports:
      - "3307:3306"

    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: univers_blog

    volumes:
      - db-data:/var/lib/mysql
      - ./db/univers_blog.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db-data:
